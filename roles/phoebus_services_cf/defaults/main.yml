---
phoebus_services_cf_root: /opt/epics-tools/services/cf
phoebus_services_cf_account: csstudio

phoebus_services_cf_http_port: 8080
phoebus_services_cf_https_port: 8181

# ChannelFinder version
phoebus_services_cf_version: ChannelFinder-4.7.3
