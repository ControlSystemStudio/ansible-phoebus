---
# configure the systemd services for alarm services

# procServ
- name: Install procServ package
  become: true
  ansible.builtin.package:
    name: procServ
    state: present

# Alarm Server

# setup run-phoebus-alarm.sh
- name: Create alarm server run script
  become: true
  ansible.builtin.template:
    src: run-phoebus-alarm.sh.j2
    dest: "{{ phoebus_services_phoebus_alarm_root }}/alarm_server/run-phoebus-alarm.sh"
    mode: "u=rwx,g=rx,o=rx"
    owner: "{{ phoebus_services_phoebus_alarm_account }}"
    group: "{{ phoebus_services_phoebus_alarm_account }}"

# setup systemd service file
- name: Create alarm server systemd service file
  become: true
  ansible.builtin.template:
    src: phoebus_alarm.service.j2
    dest: "/etc/systemd/system/{{ phoebus_services_phoebus_alarm_service_name_server }}.service"
    mode: "u=rw,g=r,o=r"
    owner: root
    group: root

# start phoebus alarm server
- name: Restart alarm server
  become: true
  ansible.builtin.systemd:
    state: restarted
    daemon_reload: true
    enabled: true
    name: "{{ phoebus_services_phoebus_alarm_service_name_server }}"

