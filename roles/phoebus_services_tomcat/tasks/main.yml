---
- name: Add EPEL repository
  become: true
  ansible.builtin.package:
    name: epel-release
    state: present

- name: Install basic packages
  become: true
  ansible.builtin.package:
    name: ["vim", "bash-completion", "tmux", "tree", "htop", "wget", "unzip", "curl", "git"]
    state: present

# TODO use the tomcat user
- name: Add tomcat group
  become: true
  ansible.builtin.group:
    name: tomcat

- name: Add tomcat user
  become: true
  ansible.builtin.user:
    name: tomcat
    group: tomcat
    home: "{{ phoebus_services_tomcat_dest }}"
    create_home: false
    system: true

- name: Download Tomcat
  become: true
  ansible.builtin.get_url:
    url: "{{ phoebus_services_tomcat_archive_url }}"
    dest: "{{ phoebus_services_tomcat_archive_dest }}"

- name: Create tomcat directory
  become: true
  ansible.builtin.file:
    path: "{{ phoebus_services_tomcat_dest }}"
    state: directory
    owner: "{{ phoebus_services_tomcat_account }}"
    group: "{{ phoebus_services_tomcat_account }}"

- name: Extract tomcat archive
  become: true
  ansible.builtin.unarchive:
    src: "{{ phoebus_services_tomcat_archive_dest }}"
    dest: "{{ phoebus_services_tomcat_dest }}"
    owner: "{{ phoebus_services_tomcat_account }}"
    group: "{{ phoebus_services_tomcat_account }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: "{{ phoebus_services_tomcat_dest }}/bin"

- name: Copy tomcat service file
  become: true
  ansible.builtin.template:
    src: tomcat.service.j2
    dest: "/etc/systemd/system/{{ phoebus_services_tomcat_service_name }}.service"
    owner: root
    group: root
    mode: "u=rw,g=r,o=r"
  when: ansible_service_mgr == "systemd"

- name: Set ports and other server configuration
  become: true
  ansible.builtin.template:
    src: server.xml.j2
    dest: "{{ phoebus_services_tomcat_dest }}/conf/server.xml"
    owner: "{{ phoebus_services_tomcat_account }}"
    group: "{{ phoebus_services_tomcat_account }}"
    mode: "u=rw,g=r,o=r"

- name: Start and enable tomcat
  become: true
  ansible.builtin.service:
    daemon_reload: true
    name: "{{ phoebus_services_tomcat_service_name }}"
    state: started
    enabled: true
  when: ansible_service_mgr == "systemd"

- name: Set UI access credentials
  become: true
  ansible.builtin.template:
    src: tomcat-users.xml.j2
    dest: "{{ phoebus_services_tomcat_dest }}/conf/tomcat-users.xml"
    owner: "{{ phoebus_services_tomcat_account }}"
    group: "{{ phoebus_services_tomcat_account }}"
    mode: "u=rw,g=r,o=r"
  notify: restart tomcat

- name: Allow access to Manager and Host Manager apps from any IP
  become: true
  ansible.builtin.template:
    src: context.xml.j2
    dest: "{{ item }}"
    owner: "{{ phoebus_services_tomcat_account }}"
    group: "{{ phoebus_services_tomcat_account }}"
    mode: "u=rw,g=r,o=r"
  loop:
    - "{{ phoebus_services_tomcat_dest }}/webapps/host-manager/META-INF/context.xml"
    - "{{ phoebus_services_tomcat_dest }}/webapps/manager/META-INF/context.xml"
  notify: restart tomcat
