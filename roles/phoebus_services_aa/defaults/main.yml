---
# defaults file for phoebus_services_aa
# Single-node defaults with SSL enabled.

epics_services_account: csstudio

# JDK and Tomcat configuration (using system RPM installation)
default_jdk_version: "17"
aa_tomcat_home: "/usr/share/tomcat"
aa_tomcat_native_lib: "/usr/lib64"  # libtcnative-1.so from tomcat-native RPM

aa_dependencies_loc: /tmp/aa_dependencies
aa_build_loc: /tmp/aa_build
aa_version: 2.0.8

aa_service_name: archiver_aa
aa_script_prefix: archiver

# Service filesystem layout (release/conf/data/logs/run)
aa_root: "/opt/epics-tools/services/archiver"
aa_release_dir: "{{ aa_root }}/release"
aa_conf_dir: "{{ aa_root }}/conf"
aa_data_dir: "{{ aa_root }}/data"
aa_logs_dir: "{{ aa_root }}/logs"
aa_run_dir: "{{ aa_root }}/run"

# Backward-compatible path variables used in tasks/templates
aa_install_location: "{{ aa_release_dir }}/install"
aa_deploy_location: "{{ aa_run_dir }}"
aa_appliances_file: "{{ aa_conf_dir }}/appliances.xml"
aa_policies_file: "{{ aa_conf_dir }}/policies.py"

# Archiver Appliance MySQL info (each node has its own database)
aa_mysql_server: "localhost"
aa_mysql_database: "archappl"
aa_mysql_user: "archappl"
aa_mysql_password: "archappl"

# Archiver identity.
# For multi-node deployments, set this to appliance0/appliance1/... uniquely per node.
aa_identity: appliance0

# Hostname used for this node in appliances.xml.
aa_node_hostname: "{{ inventory_hostname }}"

# Archiver Identity and Ports
cluster_inetport: 17670
mgmt_port: 17665
engine_port: 17666
etl_port: 17667
data_retrieval_port: 17668

# SSL is disabled by default. Set to true to enable TLS URLs and certificate setup.
aa_enable_ssl: false

# SSL Certificate paths (from acme_certificates role)
aa_ssl_cert_file: "/etc/nsls2/certs/server.crt"
aa_ssl_key_file: "/etc/nsls2/certs/server.key"
aa_ssl_chain_file: "/etc/nsls2/certs/server_chain.pem"

# Trusted reverse proxies for RemoteIpValve (X-Forwarded-* headers)
aa_trusted_proxies:
  - "0:0:0:0:0:0:0:1"    # IPv6 localhost
  - "127.0.0.1"          # IPv4 localhost
  - "198.125.209.51"     # Proxy IPs
  - "198.125.209.52"
  - "198.125.209.54"
  - "198.125.209.55"

# Archiver channel access options (should be 10.69.59.255 for testing cluster setup)
aa_epics_ca_addr_list: "10.69.59.255"

# Archiver Java Options
# java_home_rpm is set by dependencies.yml task
aa_java_home: "{{ java_home_rpm | default('/usr/lib/jvm/java-' ~ default_jdk_version ~ '-openjdk') }}"
aa_java_opts_engine: "-XX:+UseG1GC -Xmx10G -Xms4G -ea"
aa_java_opts_retrieval: "-XX:+UseG1GC -Xmx10G -Xms4G -ea"
aa_java_opts_etl: "-XX:+UseG1GC -Xmx5G -Xms1G -ea"
aa_java_opts_mgmt: "-XX:+UseG1GC -Xmx5G -Xms1G -ea"

# Archiver Data Locations
aa_sts: "{{ aa_data_dir }}/sts/ArchiverStore"
aa_mts: "{{ aa_data_dir }}/mts/ArchiverStore"
aa_lts: "{{ aa_data_dir }}/lts/ArchiverStore"

# Archiver Log Locations
aa_logs_base_dir: "{{ aa_logs_dir }}"
aa_configure_custom_logs: true

# Cluster appliances configuration.
# For multi-node deployments this list must be identical on all nodes.
aa_cluster_appliances:
  - identity: appliance0
    hostname: "{{ aa_node_hostname }}"
    cluster_inetport: "{{ cluster_inetport }}"
