---

# Create the AA service filesystem layout.
- name: Ensure AA service directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"
    mode: "0755"
  loop:
    - "{{ aa_root }}"
    - "{{ aa_release_dir }}"
    - "{{ aa_conf_dir }}"
    - "{{ aa_data_dir }}"
    - "{{ aa_logs_dir }}"
    - "{{ aa_run_dir }}"
    - "{{ aa_install_location }}"
    - "{{ aa_deploy_location }}"

# Prepare the Archiver binaries for installation
- name: Find Service package
  become: true
  find:
    paths: "{{ aa_build_loc }}"
    patterns: "archappl*tar.gz"
    recurse: true
  register: find_result

- name: Unpack service on remote host
  become: true
  unarchive:
    src: "{{ find_result.files[0].path }}"
    dest: "{{ aa_install_location }}"
    remote_src: true
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"

- name: Set the owner and group
  file:
    path: "{{ aa_install_location }}"
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"
    recurse: true

- name: Unpack the mysql connection
  unarchive:
    src: "{{ aa_dependencies_loc }}/mysql-connector-java-5.1.34.tar.gz"
    dest: "{{ aa_install_location }}"
    remote_src: true
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"

# Setup the single installation script
- name: setup single installation script
  become: true
  template:
    src: single_machine_install.sh
    dest: "{{ aa_install_location }}/install_scripts/"
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"
    
- name: setup mysql config script
  become: true
  template:
    src: addMysqlConnPool.py
    dest: "{{ aa_install_location }}/install_scripts/"
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"
    
- name: setup tomcat installation script 
  template:
    src: deployMultipleTomcats.py
    dest: "{{ aa_install_location }}/install_scripts/"
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"

- name: setup conf files for installation 
  become: true
  template:
    src: policies.py
    dest: "{{ aa_policies_file }}"
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"

# Deploy appliances.xml for cluster configuration
- name: Deploy appliances.xml configuration
  become: true
  template:
    src: appliances.xml.j2
    dest: "{{ aa_appliances_file }}"
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"
    mode: '0644'

# Run the Install script
- name: Install AA
  become: true
  ansible.builtin.command:
    chdir: "{{ aa_install_location }}/install_scripts"
    cmd: "{{ aa_install_location }}/install_scripts/single_machine_install.sh"
  environment:
    DEPLOY_DIR: "{{ aa_deploy_location }}"
    JAVA_HOME: "{{ aa_java_home }}"
    TOMCAT_HOME: "{{ aa_tomcat_home }}"
    MYSQL_CLIENT_JAR: "{{ aa_install_location }}/mysql-connector-java-5.1.34/mysql-connector-java-5.1.34-bin.jar"
    MYSQL_CONNECTION_STRING: "--host={{ aa_mysql_server }} --user={{ aa_mysql_user }} --password={{ aa_mysql_password }} --database={{ aa_mysql_database }}"
    SITE_SPECIFIC_POLICIES_FILE: "{{ aa_policies_file }}"
    ARCHAPPL_APPLIANCES: "{{ aa_appliances_file }}"
    ARCHAPPL_MYIDENTITY: "{{ aa_identity }}"
    ENABLE_SSL: "{{ aa_enable_ssl | ternary('true', 'false') }}"
    SSL_CERT_FILE: "{{ aa_ssl_cert_file }}"
    SSL_KEY_FILE: "{{ aa_ssl_key_file }}"
    SSL_CHAIN_FILE: "{{ aa_ssl_chain_file }}"
    SSL_PORT_MGMT: "{{ mgmt_port }}"
    SSL_PORT_ENGINE: "{{ engine_port }}"
    SSL_PORT_ETL: "{{ etl_port }}"
    SSL_PORT_RETRIEVAL: "{{ data_retrieval_port }}"
    TRUSTED_PROXIES: "{{ aa_trusted_proxies | map('regex_replace', '\\.', '\\\\.') | join('|') }}"
  changed_when: true

- name: setup conf files for installation
  become: true
  template:
    src: facility_template_changes.html
    dest: "/tmp/facility_template_changes.html"
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"

# Configure site specific content
- name: Configure static AA content
  become: true
  ansible.builtin.command:
    chdir: "{{ aa_install_location }}/install_scripts"
    cmd: "java -cp ${DEPLOY_DIR}/mgmt/webapps/mgmt/WEB-INF/classes:${DEPLOY_DIR}/mgmt/webapps/mgmt/WEB-INF/lib/log4j-1.2-api-*.jar org.epics.archiverappliance.mgmt.bpl.SyncStaticContentHeadersFooters /tmp/facility_template_changes.html ${DEPLOY_DIR}/mgmt/webapps/mgmt/ui"
  environment:
    DEPLOY_DIR: "{{ aa_deploy_location }}"
    PATH: "{{ aa_java_home }}/bin:${PATH}"
  changed_when: true

# A temporary fix for the mysql connection host
- name: Replace mysql host string
  replace:
    path: "{{ aa_deploy_location }}/mgmt/conf/context.xml"
    regexp: 'jdbc:mysql://localhost:3306'
    replace: "jdbc:mysql://{{ aa_mysql_server }}:3306"

# Setup the startup/shutdown scripts for each instance
- name: "Setup startup script for {{ item.name }} instance"
  template:
    src: instance_startup.sh.j2
    dest: "{{ aa_deploy_location }}/{{ aa_script_prefix }}_{{ item.name }}_startup.sh"
    mode: 0755
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"
  loop:
    - { name: 'mgmt', java_opts: '{{ aa_java_opts_mgmt }}' }
    - { name: 'engine', java_opts: '{{ aa_java_opts_engine }}' }
    - { name: 'etl', java_opts: '{{ aa_java_opts_etl }}' }
    - { name: 'retrieval', java_opts: '{{ aa_java_opts_retrieval }}' }
  vars:
    aa_instance_name: "{{ item.name }}"
    aa_java_opts: "{{ item.java_opts }}"

- name: Setup aggregate startup script for all AA instances
  template:
    src: aa_startup.sh.j2
    dest: "{{ aa_deploy_location }}/{{ aa_script_prefix }}_startup.sh"
    mode: 0755
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"

# Fix permissions for deploy
- name: Set the owner and group
  file:
    path: "{{ aa_deploy_location }}"
    owner: "{{ epics_services_account }}"
    group: "{{ epics_services_account }}"
    recurse: true

- name: Include custom log configuration tasks
  ansible.builtin.include_tasks: configure_logs.yml
  when: aa_configure_custom_logs | bool

# Setup a single aggregate systemd service using the startup script
- name: Setup aggregate AA systemd service file
  template:
    src: aa.service.j2
    dest: "/etc/systemd/system/{{ aa_service_name }}.service"
    mode: 0644
    owner: root
    group: root

- name: Restart and enable aggregate AA service
  ansible.builtin.systemd:
    state: restarted
    enabled: true
    daemon_reload: true
    name: "{{ aa_service_name }}.service"
