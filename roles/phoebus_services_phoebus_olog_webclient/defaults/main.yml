---
# Base backend URL for the Olog service. Keep this as the single source of truth.
phoebus_services_phoebus_olog_webclient_olog_url: "https://localhost:4181/Olog"
phoebus_services_phoebus_olog_webclient_root: /opt/epics-tools/services/olog_webclient
phoebus_services_phoebus_olog_webclient_project_path: "{{ phoebus_services_phoebus_olog_webclient_root }}/phoebus-olog-web-client"
phoebus_services_phoebus_olog_webclient_version: v2.8.0
phoebus_services_phoebus_olog_webclient_account: csstudio
phoebus_services_phoebus_olog_webclient_service_name: phoebus_services_phoebus_olog_webclient
phoebus_services_phoebus_olog_webclient_http_port: 3000
phoebus_services_phoebus_olog_webclient_public_path: "/"

# Websocket and Swagger URLs
phoebus_services_phoebus_olog_webclient_websocket_url: "{{ phoebus_services_phoebus_olog_webclient_olog_url.rstrip('/') | regex_replace('^http', 'ws') }}/web-socket"
phoebus_services_phoebus_olog_webclient_swagger_url: "{{ phoebus_services_phoebus_olog_webclient_olog_url.rstrip('/') }}/api/swagger-ui"
phoebus_services_phoebus_olog_webclient_support_href: "https://github.com/Olog/phoebus-olog-web-client"
phoebus_services_phoebus_olog_webclient_app_title: "Olog"

# procServ port
phoebus_services_phoebus_olog_webclient_procserv_port: 4147
