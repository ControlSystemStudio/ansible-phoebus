---
# tasks file for phoebus_services_phoebus_olog_webclient

# create the installation location for the Olog webclient service
- name: Ensure services folder exists
  become: true
  ansible.builtin.file:
    path: "{{ phoebus_services_phoebus_olog_webclient_root }}"
    state: directory
    owner: "{{ phoebus_services_phoebus_olog_webclient_account }}"
    group: "{{ phoebus_services_phoebus_olog_webclient_account }}"
    recurse: true

# Olog webclient
- name: Clone and/or update Olog webclient repo
  become: true
  become_user: "{{ phoebus_services_phoebus_olog_webclient_account }}"
  ansible.builtin.git:
    repo: https://github.com/Olog/phoebus-olog-web-client.git
    dest: "{{ phoebus_services_phoebus_olog_webclient_project_path }}"
    force: true
    version: "{{ phoebus_services_phoebus_olog_webclient_version }}"
    update: true

- name: Copy .env template file to project folder
  become: true
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ phoebus_services_phoebus_olog_webclient_project_path }}/.env"
    mode: "u=rw,g=r,o=r"
    owner: "{{ phoebus_services_phoebus_olog_webclient_account }}"
    group: "{{ phoebus_services_phoebus_olog_webclient_account }}"

- name: Download NodeSource setup script for Node.js 21
  become: true
  ansible.builtin.get_url:
    url: https://rpm.nodesource.com/setup_21.x
    dest: /tmp/nodesource_setup.sh
    mode: "u=rwx,g=rx,o=rx"

- name: Run Node.js setup script
  become: true
  ansible.builtin.command: bash /tmp/nodesource_setup.sh
  changed_when: true

- name: Install Node.js
  become: true
  ansible.builtin.package:
    name: nodejs
    state: present

- name: Install project dependencies with npm
  become: true
  become_user: "{{ phoebus_services_phoebus_olog_webclient_account }}"
  community.general.npm:
    path: "{{ phoebus_services_phoebus_olog_webclient_project_path }}"
    production: false

- name: Run npm build script
  become: true
  become_user: "{{ phoebus_services_phoebus_olog_webclient_account }}"
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ phoebus_services_phoebus_olog_webclient_project_path }}"
  changed_when: true

- name: Install serve globally with npm
  become: true
  community.general.npm:
    name: serve
    global: true

# Setup and configure Olog webclient systemd services
- name: Include tasks to configure Olog webclient systemd services
  ansible.builtin.include_tasks: configure_services.yml
